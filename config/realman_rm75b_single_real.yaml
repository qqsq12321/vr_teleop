# Floor-mounted single RM75-B arm. Kept separate from realman_real.yaml,
# which describes the dual-arm torso robot on a different subnet and whose
# loader requires both left_ip and right_ip.
#
# No hardware performance guarantee. The safety section is for the legacy
# debug runner only.
network:
  # The lone arm is addressed as the right side; RealManOutput connects only
  # the sides it is given. The vendored legacy SDK fixes TCP port to 8080.
  right_ip: 192.168.1.18
input:
  mode: relay
  relay_host: 127.0.0.1
  relay_port: 63902
  direct_port: 63901
  broadcast_port: 29888
control:
  position_scale: 1.5
  ema_alpha: 0.5
  rot_weight: 1.0
  ik_damping: 0.001
  ik_current_weight: 0.3
  # Per-cycle approach toward the tracked target, as a first-order filter:
  # gain = 1 - exp(-period / tau). 0.1813 at the 20 ms loop is tau = 0.1 s,
  # matching engram_Teleop_DAQ's approach_time_constant_sec. The earlier 0.08
  # (tau ~0.24 s) felt soft and slow to arrive; this tracks more tightly at the
  # cost of smoothness. Recompute if CONTROL_PERIOD_S changes.
  pos_gain: 0.1813
  rot_gain: 0.1813
  follow: true
safety:  # legacy debug runner only; not used by the daily master-style loop.
  rate_hz: 50.0
  input_timeout_s: 0.25
  feedback_timeout_s: 0.2
  command_timeout_s: 0.08
  joint_margin_rad: 0.0872664626
  tracking_error_rad: 0.1745329252
  tracking_error_grace_s: 0.2
  collision_margin_m: 0.02
hands:
  # Both hands plug into the arm's end tool port; the controller relays their
  # RS485 traffic. The tool port's supply voltage is NOT set from here: it is
  # read, and the program refuses to start at 0V. Set it on the teach pendant
  # for whichever hand is actually fitted.
  inspire:
    baudrate: 115200
    rate_hz: 25
  rohand:
    # OYMotion factory defaults (roh_firmware protocol doc): node id 2, 115200.
    baudrate: 115200
    device_id: 2
    rate_hz: 25
    # Which end of ROHand's 0..65535 logical range is a closed finger. The
    # vendor protocol does not say; confirm with --hand-only before trusting it.
    closed_is_max: true
