[project]
name = "quest-teleop-mujoco"
version = "0.1.0"
description = "VR hand-tracking teleoperation for MuJoCo simulation and real robot arms."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
realman = ["PyYAML>=6.0"]
# RM_API2, the vendor's handle-based SDK. Only the single-arm RM75-B real-robot
# path needs it; simulation and the legacy dual-arm path (which uses the
# vendored SDK under third_party/realman_api) do not.
rm75b-single = ["PyYAML>=6.0", "Robotic_Arm>=1.1.6"]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
